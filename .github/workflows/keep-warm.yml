name: Keep functions warm
  on:
    schedule:
      - cron: "*/5 * * * *"
    workflow_dispatch:
  jobs:
    ping:
      runs-on: ubuntu-latest
      steps:
        - name: Ping data
          run: curl -s -o /dev/null -w "data %{http_code} %{time_total}s\n"
  "https://medisinas.com/api/data?action=get-medicamentos&userId=00000000-0000-0000-0000-000000000000"
        - name: Ping geocode
          run: curl -s -o /dev/null -w "geocode %{http_code} %{time_total}s\n" -X POST -H "Content-Type:
  application/json" -d "{\"farmacias\":[]}" "https://medisinas.com/api/geocode"
