name: keep-warm
  on:
    schedule:
      - cron: "*/5 * * * *"
    workflow_dispatch:
  jobs:
    ping:
      runs-on: ubuntu-latest
      steps:
        - run: curl -s "https://medisinas.com/api/data?action=get-medicamentos&userId=warm"
        - run: curl -s -X POST -H "Content-Type: application/json" -d "{}"
  "https://medisinas.com/api/geocode"
